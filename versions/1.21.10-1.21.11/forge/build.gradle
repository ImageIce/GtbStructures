    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Shared by the 26.x roots, which discover these same smoke classes automatically.
def guessSoundMigrationSmokes = [
        'com.gtbstructures.sound.GuessSoundsModernSmoke',
        'com.gtbstructures.sound.MinecraftClientSoundBridgeSmoke',
        'com.gtbstructures.sound.GuessSoundsChatModernSmoke',
        'com.gtbstructures.sound.SoundIconMappingSmoke',
        'com.gtbstructures.GuessSoundsConfigModernSmoke',
        'com.gtbstructures.scoreboard.GuessSoundsUiStateSmoke',
        'com.gtbstructures.stats.GameStatsNickBuilderScoreSmoke',
]
guessSoundMigrationSmokes.each { smokeClass ->
    def taskName = 'run' + smokeClass.substring(smokeClass.lastIndexOf('.') + 1)
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.testClasses
        classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
        mainClass = smokeClass
    }
}
tasks.named('runSmokeTests') {
    dependsOn guessSoundMigrationSmokes.collect { 'run' + it.substring(it.lastIndexOf('.') + 1) }
}

