plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'eventbus.api.strictRuntimeChecks', 'true'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-forge-${minecraft_jar_version}-${mod_version.replaceFirst(/-modern\.\d+$/, '')}.jar"
    from('../../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_GtbStructures' }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'gtbstructures.mixins.json'
        ])
    }
}

tasks.register('verifyCrossVersionIdentifierLinks') {
    group = 'verification'
    description = 'Rejects class links to the identifier name that changed between 1.21.10 and 1.21.11.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })

    doLast {
        def forbiddenTypes = [
                'net/minecraft/resources/ResourceLocation',
                'net/minecraft/resources/Identifier'
        ]
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        zipTree(jarFile).matching { include '**/*.class' }.each { classFile ->
            def classBytes = new String(classFile.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            forbiddenTypes.each { forbiddenType ->
                if (classBytes.contains(forbiddenType)) {
                    offenders << "${classFile.name}: ${forbiddenType}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Cross-version Minecraft identifier links found:\n  '
                    + offenders.sort().join('\n  '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCrossVersionIdentifierLinks')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

