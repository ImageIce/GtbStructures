[
    GuessSoundController: 'com.gtbstructures.sound.GuessSoundControllerSmoke',
    EndGameFireworkController: 'com.gtbstructures.sound.EndGameFireworkControllerSmoke',
    HypixelGuessChat: 'com.gtbstructures.translation.HypixelGuessChatSmoke',
    GameTrackerPendingBuilderFork: 'com.gtbstructures.scoreboard.GameTrackerPendingBuilderForkSmoke',
    StatsThemeResolution: 'com.gtbstructures.stats.StatsThemeResolutionSmoke',
    GuessSoundChat: 'com.gtbstructures.sound.GuessSoundChatSmoke',
    GuessSoundsUiLogic: 'com.gtbstructures.scoreboard.GuessSoundsUiLogicSmoke',
    CommandGtbGuessSound: 'com.gtbstructures.commands.CommandGtbGuessSoundSmoke',
    GuessSoundsConfig: 'com.gtbstructures.GuessSoundsConfigSmoke'
].each { name, smokeClass ->
    tasks.create(name: "run${name}Smoke", type: JavaExec) {
        group = 'verification'
        description = "Checks legacy ${name} behavior."
        dependsOn testClasses
        classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
        main = smokeClass
    }
}
