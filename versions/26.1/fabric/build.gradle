plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.18'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

def sharedProjectRoot = file('../../1.21.10-1.21.11/fabric')
def sharedMainJava = file("${sharedProjectRoot}/src/main/java")
def sharedMainResources = file("${sharedProjectRoot}/src/main/resources")
def sharedTestJava = file("${sharedProjectRoot}/src/test/java")
def sharedTestResources = file("${sharedProjectRoot}/src/test/resources")

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

sourceSets {
    main {
        java.setSrcDirs([sharedMainJava, 'src/main/java'])
        resources.setSrcDirs(['src/main/resources'])
    }
    test {
        java.setSrcDirs([sharedTestJava, 'src/test/java'])
        resources.setSrcDirs(sharedTestResources.exists() ? [sharedTestResources] : [])
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

def spawnEggClassicSpecFile = file("${sharedProjectRoot}/src/main/spawn_egg_classic_models.csv")
def spawnEggGeneratedResources = layout.buildDirectory.dir('generated/gtbsSpawnEggResources')
tasks.register('generateSpawnEggItemModels') {
    inputs.file spawnEggClassicSpecFile
    outputs.dir spawnEggGeneratedResources

    doLast {
        def generatedRoot = spawnEggGeneratedResources.get().asFile
        delete generatedRoot
        def specs = spawnEggClassicSpecFile.readLines('UTF-8')
                .findAll { line -> !line.trim().isEmpty() && !line.trim().startsWith('#') }
                .collect { line ->
                    def fields = line.split(',', -1)*.trim()
                    if (fields.size() != 3 || !(fields[0] ==~ /[a-z0-9_]+/)
                            || !(fields[1] ==~ /[0-9A-Fa-f]{6}/)
                            || !(fields[2] ==~ /[0-9A-Fa-f]{6}/)) {
                        throw new GradleException("Invalid spawn egg model row: ${line}")
                    }
                    [name: fields[0], base: fields[1], overlay: fields[2]]
                }
        if (specs.size() != 61 || specs*.name.toSet().size() != specs.size()) {
            throw new GradleException("Expected 61 unique spawn egg model rows, got ${specs.size()}")
        }

        def modelFile = new File(generatedRoot,
                'assets/gtbstructures/models/item/spawn_egg/classic.json')
        modelFile.parentFile.mkdirs()
        modelFile.text = new groovy.json.JsonBuilder([
                parent: 'minecraft:item/generated',
                textures: [
                        layer0: 'gtbstructures:item/spawn_egg/classic/spawn_egg',
                        layer1: 'gtbstructures:item/spawn_egg/classic/spawn_egg_overlay'
                ]
        ]).toPrettyString() + '\n'

        specs.each { spec ->
            int baseArgb = (int) (0xFF000000L | Integer.parseInt(spec.base, 16))
            int overlayArgb = (int) (0xFF000000L | Integer.parseInt(spec.overlay, 16))
            def itemFile = new File(generatedRoot,
                    "assets/gtbstructures/items/spawn_egg/classic/${spec.name}.json")
            itemFile.parentFile.mkdirs()
            itemFile.text = new groovy.json.JsonBuilder([
                    model: [
                            type: 'minecraft:model',
                            model: 'gtbstructures:item/spawn_egg/classic',
                            tints: [
                                    [type: 'minecraft:constant', value: baseArgb],
                                    [type: 'minecraft:constant', value: overlayArgb]
                            ]
                    ]
            ]).toPrettyString() + '\n'
        }
    }
}

sourceSets.main.resources.srcDir spawnEggGeneratedResources

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('generateSpawnEggItemModels')
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'minecraft_version_range', project.minecraft_version_range
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version

    from(sharedMainResources) {
        exclude 'fabric.mod.json'
        exclude 'gtbstructures.mixins.json'
    }

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                minecraft_version_range: project.minecraft_version_range,
                fabric_loader_version: project.fabric_loader_version,
                fabric_api_version: project.fabric_api_version
        )
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${project.mod_id}-fabric-${project.minecraft_jar_version}-${project.mod_version}.jar"
    from('../../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_GtbStructures' }
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn tasks.named('generateSpawnEggItemModels')
    archiveFileName = "${project.mod_id}-fabric-${project.minecraft_jar_version}-${project.mod_version}-sources.jar"
    from('../../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_GtbStructures' }
    }
}

def smokeTasks = []
[[root: sharedTestJava, workingDir: sharedProjectRoot],
 [root: file('src/test/java'), workingDir: projectDir]].each { smokeRoot ->
    if (!smokeRoot.root.exists()) return
    fileTree(smokeRoot.root).matching { include '**/*Smoke.java' }.files.sort().each { smokeFile ->
        def relative = smokeRoot.root.toPath().relativize(smokeFile.toPath()).toString()
        def mainClassName = relative.replace(File.separatorChar, '.' as char).replaceFirst(/\.java$/, '')
        def simpleName = mainClassName.substring(mainClassName.lastIndexOf('.') + 1)
        if (simpleName == 'FabricModMetadataSmoke') return
        def smokeTask = tasks.register("run${simpleName}", JavaExec) {
            group = 'verification'
            description = "Runs ${simpleName}."
            dependsOn tasks.testClasses
            classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
            mainClass = mainClassName
            workingDir = smokeRoot.workingDir
        }
        smokeTasks << smokeTask
    }
}

tasks.register('runSmokeTests') {
    group = 'verification'
    description = 'Runs the complete shared GTBS Fabric smoke suite.'
    dependsOn smokeTasks
}
