plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

def sharedProjectRoot = file('../../1.21.10-1.21.11/forge')
def sharedMainJava = file("${sharedProjectRoot}/src/main/java")
def sharedMainResources = file("${sharedProjectRoot}/src/main/resources")
def sharedTestJava = file("${sharedProjectRoot}/src/test/java")
def sharedTestResources = file("${sharedProjectRoot}/src/test/resources")
def targetMainJava = file('src/main/java')
def targetTestJava = file('src/test/java')
def targetWorkRoot = providers.gradleProperty('gtbsTargetWorkRoot').orNull
def mavenizerMemory = providers.gradleProperty('gtbsMavenizerMemory').orNull
def targetRunDirectory = file('run')

if (targetWorkRoot != null && !targetWorkRoot.trim().isEmpty()) {
    def externalWorkRoot = file(targetWorkRoot)
    layout.buildDirectory.set(new File(externalWorkRoot, 'build'))
    targetRunDirectory = new File(externalWorkRoot, 'run')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    if (mavenizerMemory != null && !mavenizerMemory.trim().isEmpty()) {
        mavenizerArguments.addAll('--decompile-memory', mavenizerMemory.trim())
    }

    runs {
        configureEach {
            workingDir = targetRunDirectory
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

sourceSets {
    main {
        java.setSrcDirs([sharedMainJava])
        java.exclude(
                'com/gtbstructures/GtbStructuresForge.java',
                'com/gtbstructures/items/HandheldItemOverlayRenderer.java',
                'com/gtbstructures/overlay/ModernHudOverlayRenderer.java',
                'com/gtbstructures/overlay/WorldEnvironmentOverlayRenderer.java',
                'com/gtbstructures/scoreboard/CustomScoreboardOverlayRenderer.java',
                'com/gtbstructures/scoreboard/PreviewEditorOverlayRenderer.java',
                'com/gtbstructures/scoreboard/PreviewScreenController.java'
        )
        resources.setSrcDirs(['src/main/resources'])
    }
    test {
        java.setSrcDirs([sharedTestJava])
        java.exclude('com/gtbstructures/items/DisallowedItemHiderSmoke.java')
        java.exclude('com/gtbstructures/items/HandheldItemTrackerSmoke.java')
        java.exclude('com/gtbstructures/overlay/ForgeHudLayerBridgeSmoke.java')
        java.exclude('com/gtbstructures/ModernCommandRegistrationSmoke.java')
        resources.setSrcDirs(sharedTestResources.exists() ? [sharedTestResources] : [])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile) {
    // ForgeGradle 7 shares build/sourceSets/main between classes and resources.
    // Compile last so a clean processResources run cannot erase the class files.
    mustRunAfter(tasks.named('processResources'))
    source(fileTree(targetMainJava) {
        include '**/*.java'
    })
}

tasks.named('compileTestJava', JavaCompile) {
    source(fileTree(targetTestJava) {
        include '**/*.java'
    })
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.named('processResources', ProcessResources) {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version: project.forge_version,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description,
    ]
    inputs.properties replaceProperties

    from(sharedMainResources) {
        exclude 'META-INF/mods.toml'
        exclude 'pack.mcmeta'
        exclude 'gtbstructures-resource-pack.properties'
    }
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${project.mod_id}-forge-${project.minecraft_jar_version}-${project.mod_version}.jar"
    from('../../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_GtbStructures' }
    }
    manifest {
        attributes([
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : project.mod_authors,
                'MixinConfigs'          : 'gtbstructures.mixins.json'
        ])
    }
}

tasks.register('verifyCrossVersionIdentifierLinks') {
    group = 'verification'
    description = 'Rejects hard links to identifier names that vary across supported Minecraft releases.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })

    doLast {
        def forbiddenTypes = [
                'net/minecraft/resources/ResourceLocation',
                'net/minecraft/resources/Identifier'
        ]
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        zipTree(jarFile).matching { include '**/*.class' }.each { classFile ->
            def classBytes = new String(classFile.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            forbiddenTypes.each { forbiddenType ->
                if (classBytes.contains(forbiddenType)) {
                    offenders << "${classFile.name}: ${forbiddenType}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Cross-version Minecraft identifier links found:\n  '
                    + offenders.sort().join('\n  '))
        }
    }
}

def smokeTasks = []
def registeredSmokeClasses = [] as Set
[[root: file('src/test/java'), workingDir: projectDir],
 [root: sharedTestJava, workingDir: sharedProjectRoot]].each { smokeRoot ->
    if (!smokeRoot.root.exists()) return
    fileTree(smokeRoot.root).matching { include '**/*Smoke.java' }.files.sort().each { smokeFile ->
        def relative = smokeRoot.root.toPath().relativize(smokeFile.toPath()).toString()
        def mainClassName = relative.replace(File.separatorChar, '.' as char).replaceFirst(/\.java$/, '')
        if (!registeredSmokeClasses.add(mainClassName)) return
        def simpleName = mainClassName.substring(mainClassName.lastIndexOf('.') + 1)
        def smokeTask = tasks.register("run${simpleName}", JavaExec) {
            group = 'verification'
            description = "Runs ${simpleName}."
            dependsOn tasks.testClasses
            classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
            mainClass = mainClassName
            workingDir = smokeRoot.workingDir
        }
        smokeTasks << smokeTask
    }
}

tasks.register('runSmokeTests') {
    group = 'verification'
    description = 'Runs the complete shared GTBS Forge smoke suite.'
    dependsOn tasks.named('verifyCrossVersionIdentifierLinks')
    dependsOn smokeTasks
}
